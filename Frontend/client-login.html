<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Login | Nutzy Craft</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Quicksand:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
    <script src="config.js"></script>
    <script src="clerk-auth.js"></script>
    <style>
        .client-auth-card {
            border-top: 5px solid var(--primary);
        }

        .client-badge {
            background-color: var(--primary);
            color: #fff;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            display: inline-block;
            margin-bottom: 10px;
        }

        .auth-error {
            background: #fff0f0;
            color: #d32f2f;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-bottom: 15px;
            display: none;
        }

        #clerk-sign-in {
            display: flex;
            justify-content: center;
        }
    </style>
</head>

<body>
    <nav class="navbar glass-panel">
        <div class="container nav-container">
            <a href="index.html" class="logo">
                <img src="logo.jpg" alt="Nutzy Craft Logo" class="logo-img">
                Nutzy Craft
            </a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="services.html">Services</a>
                <a href="portfolio.html">Portfolio</a>
                <a href="how-it-works.html">How it Works</a>
                <a href="about.html">About Us</a>
                <a href="contact.html">Contact Us</a>
            </div>
            <div class="nav-actions">
                <a href="login.html" class="btn btn-secondary">Log In</a>
                <a href="register.html" class="btn btn-primary">Join Now</a>
            </div>
            <button class="mobile-menu-btn"><i class="fa-solid fa-bars"></i></button>
        </div>
    </nav>

    <div class="auth-page">
        <div class="glass-card auth-card client-auth-card">
            <div class="auth-header">
                <span class="client-badge">CLIENT PORTAL</span>
                <h2>Welcome Back!</h2>
                <p>Login to manage your projects and hires.</p>
            </div>

            <div class="auth-error" id="auth-error"></div>

            <div id="clerk-sign-in"></div>

            <div style="margin-top: 20px; text-align: center;">
                <p style="margin-bottom: 10px;">Not a Client? <a href="freelancer-login.html"
                        style="color: var(--secondary); font-weight: 700;">Freelancer Login</a></p>
                <p style="margin-bottom: 10px;">New here? <a href="register.html?role=client"
                        style="color: var(--primary); font-weight: 700;">Create an Account</a></p>
                <a href="index.html"
                    style="color: var(--text-muted); font-size: 0.9rem; display: inline-flex; align-items: center; gap: 8px;">
                    <i class="fa-solid fa-arrow-left"></i> Return to Home Page
                </a>
            </div>
        </div>
    </div>

    <script>
        function showError(msg) {
            const el = document.getElementById('auth-error');
            el.textContent = msg;
            el.style.display = 'block';
        }

        (async function mountSignIn() {
            const clerk = await window.NeonAuth.clerkLoading;

            clerk.mountSignIn(document.getElementById('clerk-sign-in'), {
                forceRedirectUrl: window.location.origin + '/post-auth.html?portal=client',
                fallbackRedirectUrl: window.location.origin + '/post-auth.html?portal=client',
                afterSignInUrl: window.location.origin + '/post-auth.html?portal=client',
                signUpUrl: 'register.html?role=client'
            });
        })();
    </script>

    <script src="notify.js"></script>

    <script src="script.js"></script>
</body>

</html>
