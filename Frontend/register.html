<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Nutzy Craft</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Quicksand:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
    <script src="config.js"></script>
    <script src="clerk-auth.js"></script>
    <style>
        .auth-error {
            background: #fff0f0;
            color: #d32f2f;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-bottom: 15px;
            display: none;
        }

        #clerk-sign-up {
            display: flex;
            justify-content: center;
        }

        .role-picker {
            margin-bottom: 20px;
        }

        .role-picker label.form-label {
            display: block;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>
    <nav class="navbar glass-panel">
        <div class="container nav-container">
            <a href="index.html" class="logo">
                <img src="logo.jpg" alt="Nutzy Craft Logo" class="logo-img">
                Nutzy Craft
            </a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="services.html">Services</a>
                <a href="portfolio.html">Portfolio</a>
                <a href="how-it-works.html">How it Works</a>
                <a href="about.html">About Us</a>
                <a href="contact.html">Contact Us</a>
            </div>
            <div class="nav-actions">
                <a href="login.html" class="btn btn-secondary">Log In</a>
                <a href="register.html" class="btn btn-primary">Join Now</a>
            </div>
            <button class="mobile-menu-btn"><i class="fa-solid fa-bars"></i></button>
        </div>
    </nav>

    <div class="auth-page">
        <div class="glass-card auth-card">
            <div class="auth-header">
                <h2>Join the Hive!</h2>
                <p>Create your account to start building.</p>
            </div>

            <div class="auth-error" id="auth-error"></div>

            <div class="role-picker">
                <label class="form-label">I want to...</label>
                <select class="form-select" id="roleSelect">
                    <option value="">Select an option</option>
                    <option value="CLIENT">Hire Freelancers</option>
                    <option value="FREELANCER">Work as a Freelancer</option>
                </select>
            </div>

            <div id="clerk-sign-up"></div>

            <div class="social-login">
                <div style="margin-top: 20px; text-align: center;">
                    <a href="index.html"
                        style="color: var(--text-muted); font-size: 0.9rem; display: inline-flex; align-items: center; gap: 8px;">
                        <i class="fa-solid fa-arrow-left"></i> Return to Home Page
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        function showError(msg) {
            const el = document.getElementById('auth-error');
            el.textContent = msg;
            el.style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Pre-select role from URL params (e.g. register.html?role=client)
        const urlParams = new URLSearchParams(window.location.search);
        const urlRole = urlParams.get('role');
        if (urlRole) {
            const select = document.getElementById('roleSelect');
            if (urlRole.toLowerCase() === 'client') select.value = 'CLIENT';
            if (urlRole.toLowerCase() === 'freelancer') select.value = 'FREELANCER';
        }

        function getSelectedRole() {
            return document.getElementById('roleSelect').value;
        }

        (async function mountSignUp() {
            const clerk = await window.NeonAuth.clerkLoading;
            const signUpContainer = document.getElementById('clerk-sign-up');

            function mount() {
                const role = getSelectedRole();
                clerk.mountSignUp(signUpContainer, {
                    unsafeMetadata: { role },
                    forceRedirectUrl: window.location.origin + '/post-signup.html',
                    fallbackRedirectUrl: window.location.origin + '/post-signup.html',
                    afterSignUpUrl: window.location.origin + '/post-signup.html',
                    signInUrl: 'login.html'
                });
            }

            mount();

            // Re-mount with the updated role whenever the user changes their selection,
            // and block interaction with the widget until a role is chosen.
            document.getElementById('roleSelect').addEventListener('change', () => {
                clerk.unmountSignUp(signUpContainer);
                document.getElementById('auth-error').style.display = 'none';
                mount();
            });

            // Intercept clicks inside the widget to enforce role selection before
            // the user can proceed with Google (or email) sign-up.
            signUpContainer.addEventListener('click', (e) => {
                if (!getSelectedRole()) {
                    e.stopPropagation();
                    e.preventDefault();
                    showError('Please select whether you want to hire or work as a freelancer before continuing.');
                }
            }, true);
        })();
    </script>

    <script src="notify.js"></script>

    <script src="script.js"></script>
</body>

</html>
